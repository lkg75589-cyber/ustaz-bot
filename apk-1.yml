name: Build APK
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/apk.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create app
        run: |
          mkdir app && cd app
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/app@6
          mkdir www && echo '<html><body>loading</body></html>' > www/index.html
          npx cap init Ustaz com.ustaz.app --web-dir www
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.ustaz.app",
            "appName": "Ustaz",
            "webDir": "www",
            "server": {
              "url": "https://outshoot-unburned-attic.ngrok-free.dev",
              "androidScheme": "https",
              "allowNavigation": ["*.ngrok-free.dev"]
            }
          }
          JSON
          npx cap add android
          sed -i 's#<string name="app_name">.*</string>#<string name="app_name">المدرّس الذكي</string>#; s#<string name="title_activity_main">.*</string>#<string name="title_activity_main">المدرّس الذكي</string>#' android/app/src/main/res/values/strings.xml
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ustaz-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
