<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f1628">
<title>الأستاذ — مدرّسك الذكي</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png"><link rel="apple-touch-icon" href="/icon-192.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="الأستاذ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0f1628;--card:#18223a;--card2:#212c48;--line:#2a3757;--text:#eef1fb;--muted:#8d99b8;--pri:#6c4df6;--pri2:#8c76ff;--soft:#28264f;--gold:#f4b63d;--ok:#3dd6a0;--bad:#ff6b7a;--r:18px;
--top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px)}
[data-theme=light]{--bg:#f3f5fb;--card:#fff;--card2:#eef1fa;--line:#dfe4f1;--text:#171d33;--muted:#667290;--soft:#ece8ff}
[data-theme=emerald]{--bg:#0b1a16;--card:#12261f;--card2:#193329;--line:#24433a;--text:#e9f7f1;--muted:#8fb3a6;--pri:#10b981;--pri2:#34d399;--soft:#12362b}
[data-theme=sunset]{--bg:#1c1014;--card:#2a181d;--card2:#36202a;--line:#4a2c36;--text:#fdeff0;--muted:#c49aa4;--pri:#f97316;--pri2:#fb923c;--soft:#3d2218;--gold:#fbbf24}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Cairo','Segoe UI',Tahoma,system-ui,sans-serif;font-size:15px;line-height:1.65;direction:rtl}
body{padding-top:var(--top);overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--pri2);outline-offset:2px}
#view{max-width:560px;margin:0 auto;padding:18px 16px calc(112px + var(--bot))}
.muted{color:var(--muted)}.small{font-size:12.5px}.center{text-align:center}
.h1{font-size:26px;font-weight:800;line-height:1.25}.h2{font-size:19px;font-weight:800;margin:22px 0 10px}.h3{font-size:16px;font-weight:700}
.top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px}
.ico-row{display:flex;gap:10px}
.ibtn{width:44px;height:44px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px}.grow{flex:1;min-width:0}.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;font-weight:600}
.dot{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--pri);color:#fff}
.dot.soft{background:var(--soft);color:var(--pri2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:14px;font-weight:700;background:var(--pri);color:#fff}
.btn.gold{background:var(--gold);color:#2a1d00}.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)}.btn.block{width:100%}.btn[disabled]{opacity:.5}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 12px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:13px;font-weight:600}
.chip{min-height:38px;padding:0 14px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:600;font-size:13.5px}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.bar{height:8px;border-radius:8px;background:var(--card2);overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));border-radius:8px}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}.hscroll::-webkit-scrollbar{display:none}
.scard{flex:0 0 112px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 8px;text-align:center;font-weight:700}
.scard .em{width:56px;height:56px;margin:0 auto 8px;border-radius:18px;display:grid;place-items:center;font-size:30px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:12px 0 16px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1;min-height:44px;padding:0 10px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--pri2);border-color:var(--pri)}
.sub-head{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.back{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--pri2)}
.chap{padding:16px}.chap .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.acts .pill{flex:1;justify-content:center;min-width:92px}
.tabbar{position:fixed;inset-inline:12px;bottom:calc(10px + var(--bot));max-width:536px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:22px;display:flex;padding:6px;z-index:20;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;border-radius:16px;font-size:12px;font-weight:600;color:var(--muted)}
.tabbar button.on{color:var(--pri2);background:var(--soft)}
.fab{position:fixed;inset-inline-start:16px;bottom:calc(88px + var(--bot));width:54px;height:54px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;z-index:19;box-shadow:0 8px 22px rgba(108,77,246,.5)}
.sheet-bg{position:fixed;inset:0;background:rgba(5,8,18,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);border-radius:24px 24px 0 0;width:100%;max-width:560px;max-height:86vh;overflow:auto;padding:18px 16px calc(18px + var(--bot));border:1px solid var(--line)}
.sheet .grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
.toast{position:fixed;inset-inline:16px;top:calc(14px + var(--top));max-width:520px;margin:0 auto;background:#2b3558;color:#fff;border-radius:14px;padding:12px 14px;z-index:60;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.load{position:fixed;inset:0;background:rgba(5,8,18,.72);z-index:50;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;color:#fff;font-weight:700}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid rgba(255,255,255,.2);border-top-color:var(--gold);animation:sp .9s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:10px;background:var(--soft);color:var(--pri2);font-size:12.5px;font-weight:700}
.badge.gold{background:rgba(244,182,61,.16);color:var(--gold)}
.empty{text-align:center;padding:26px 12px;color:var(--muted)}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.li:last-child{border:0}
.li .t{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
/* المحادثة */
.chat{display:flex;flex-direction:column;height:calc(100dvh - var(--top) - 20px);max-width:560px;margin:0 auto;padding:12px 12px calc(12px + var(--bot))}
.chat .msgs{flex:1;overflow:auto;padding:8px 2px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:92%;padding:11px 14px;border-radius:18px;overflow-wrap:anywhere}
.msg.u{align-self:flex-start;background:var(--pri);color:#fff;border-end-start-radius:6px}
.msg.a{align-self:stretch;max-width:100%;background:var(--card);border:1px solid var(--line);border-end-end-radius:6px}
.msg.err{background:rgba(255,107,122,.12);border:1px solid var(--bad)}
.msg p{margin:.4em 0}.msg p:first-child{margin-top:0}.msg p:last-child{margin-bottom:0}.msg ul,.msg ol{padding-inline-start:22px;margin:.4em 0}
.msg code{direction:ltr;unicode-bidi:isolate;background:var(--card2);padding:1px 6px;border-radius:6px;font-size:.9em}
.msg pre{direction:ltr;text-align:left;background:var(--card2);padding:12px;border-radius:12px;overflow:auto}
.msg h1,.msg h2,.msg h3{font-size:16px;margin:.7em 0 .3em}
.src{margin-top:8px;font-size:12px;color:var(--muted)}
.composer{display:flex;gap:8px;align-items:flex-end;padding-top:8px}
.composer textarea{flex:1;resize:none;max-height:130px;min-height:46px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:11px 14px;font:inherit}
.composer .ibtn.send{background:var(--pri);border-color:var(--pri);color:#fff}.composer .ibtn.send svg{transform:scaleX(-1)}
.typing{display:flex;gap:5px;padding:6px 2px}.typing i{width:8px;height:8px;border-radius:50%;background:var(--muted);animation:bl 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes bl{50%{opacity:.25}}
/* المعادلات: مركزية وكبيرة كما في المرجع */
.mb{direction:ltr;text-align:center;font-size:1.3em;margin:14px 0;overflow-x:auto;overflow-y:hidden;padding:4px 0}
.mi{direction:ltr;unicode-bidi:isolate;display:inline-block;max-width:100%}
.katex{text-indent:0}
/* الاختبار */
.qh{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.qtext{font-size:18px;font-weight:700;line-height:1.7;margin:12px 0 16px;overflow-wrap:anywhere}
.opt{width:100%;text-align:start;display:flex;gap:10px;align-items:center;padding:13px 14px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);margin-bottom:10px;font-weight:600;overflow-wrap:anywhere}
.opt .k{flex:0 0 28px;height:28px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:13px}
.opt.right{border-color:var(--ok);background:rgba(61,214,160,.12)}.opt.wrong{border-color:var(--bad);background:rgba(255,107,122,.12)}
.expl{background:var(--card2);border-radius:14px;padding:12px 14px;margin:6px 0 14px}
.ring{--p:0;width:150px;height:150px;border-radius:50%;margin:10px auto 14px;display:grid;place-items:center;background:conic-gradient(var(--pri2) calc(var(--p)*1%),var(--card2) 0)}
.ring b{width:118px;height:118px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:30px;font-weight:800}
.big{font-size:56px;font-weight:800;font-variant-numeric:tabular-nums;text-align:center;letter-spacing:1px}
.gate{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.stat{background:var(--card2);border-radius:14px;padding:12px;text-align:center}.stat b{display:block;font-size:22px}
select,input[type=text],input[type=number]{width:100%;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text);padding:0 12px;font:inherit}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sw input{width:44px;height:26px;accent-color:var(--pri)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lb{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 4px}
.pend{display:flex;align-items:center;gap:10px;padding:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:8px}
.pend img{width:54px;height:54px;object-fit:cover;border-radius:10px}
.gate svg{width:64px;height:64px;color:var(--pri2)}
.stat svg{color:var(--pri2)}.ico{display:inline-flex;vertical-align:middle}
.danger{color:var(--bad)}
.fring{--p:0;width:220px;height:220px;border-radius:50%;margin:12px auto 16px;display:grid;place-items:center;background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--card2) 0)}
.fring .fin{width:184px;height:184px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.wk{display:flex;gap:8px;align-items:flex-end}.wk .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.wk .bw{height:84px;width:100%;display:flex;align-items:flex-end}.wk i{display:block;width:100%;border-radius:8px 8px 4px 4px;background:linear-gradient(var(--pri2),var(--pri))}
.wk .today i{background:var(--gold)}
.mfall{font-size:1.05em;direction:ltr;unicode-bidi:isolate}
.qk{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

[data-theme=sky]{--bg:#eaf5ff;--card:#fff;--card2:#def0ff;--line:#c4e1f7;--text:#10304a;--muted:#5f86a3;--pri:#2f9bff;--pri2:#1478d6;--soft:#d9ecff}
[data-theme=lime]{--bg:#f2f9e4;--card:#fff;--card2:#e8f4d0;--line:#cfe5a6;--text:#1f3310;--muted:#6b8a4a;--pri:#6cbf1c;--pri2:#4d9a0a;--soft:#e2f3c4}
[data-theme=rose]{--bg:#fff1f6;--card:#fff;--card2:#ffe6ef;--line:#f6cfdd;--text:#3a1626;--muted:#9a6a7e;--pri:#ec4899;--pri2:#db2777;--soft:#ffe0ec}
[data-theme=royal]{--bg:#150f2e;--card:#1f1745;--card2:#2a205a;--line:#3b2f77;--text:#f3efff;--muted:#a79ad6;--pri:#8b5cf6;--pri2:#a78bfa;--soft:#2c2260;--gold:#fbbf24}
[data-theme=gold]{--bg:#1a1406;--card:#261c08;--card2:#33260c;--line:#4a3815;--text:#fff6dc;--muted:#c9b06a;--pri:#eab308;--pri2:#facc15;--soft:#3a2c0a;--gold:#fde047}
.starbadge{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:999px;background:rgba(244,182,61,.16);color:var(--gold);font-weight:800;font-size:14px}.starbadge svg{width:16px;height:16px;fill:currentColor}
.stk{display:inline-grid;place-items:center;vertical-align:middle}.stk svg{display:block}
.farmhero{border-radius:22px;padding:16px;margin-bottom:14px;color:#fff;background:linear-gradient(180deg,#4fb2e8 0%,#7cc7a0 62%,#4aa65a 100%);position:relative;overflow:hidden}
.farmhero .h1{color:#fff}.farmhero .fst{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.farmhero .fst div{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);border-radius:14px;padding:8px;text-align:center;backdrop-filter:blur(4px)}.farmhero .fst small{display:block;font-size:11.5px;opacity:.9}.farmhero .fst b{font-size:18px}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:linear-gradient(180deg,#d8f0c4,#a8dc8c);border:1px solid #9bcf7e;border-radius:22px;padding:12px}
.plot{aspect-ratio:3/4;border-radius:16px;background:linear-gradient(180deg,#f6efe2,#e8dcc6);border:1px solid #dccfb4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#6b4a2a;font-size:12px;font-weight:700;padding:6px;text-align:center}
.plot.free{background:linear-gradient(180deg,#e7f6ff,#c9ecc0)}.plot.lock{opacity:.85}.plot svg.crop{width:62px;height:62px}
.plot .pb{width:80%;height:6px;border-radius:6px;background:rgba(0,0,0,.12);overflow:hidden}.plot .pb i{display:block;height:100%;background:#3fa34d}
.plot .hv{background:#3fa34d;color:#fff;border-radius:10px;padding:2px 10px;font-size:12px}
.plot .plus{width:34px;height:34px;border-radius:50%;background:#2f8a4a;color:#fff;display:grid;place-items:center}
.cropgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.cropgrid button{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:8px 4px;text-align:center;font-weight:700;font-size:13px}.cropgrid button[disabled]{opacity:.5}.cropgrid svg.crop{width:56px;height:56px}
.shopgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.shopitem{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 6px;text-align:center;font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:6px}
.shopitem.on{outline:2px solid var(--pri)}.shopitem .pv{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;border:4px solid}.shopitem .tag{font-size:12px;border-radius:999px;padding:2px 10px;background:var(--card2)}.shopitem .tag.act{background:var(--pri);color:#fff}
.ytseg{display:flex;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:10px 0}.ytseg button{flex:1;min-height:46px;font-weight:700;color:var(--muted)}.ytseg button.on{background:var(--soft);color:var(--pri2)}
.ytav{flex:0 0 74px;text-align:center;font-size:12px;position:relative}.ytav .av{width:64px;height:64px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font-weight:800;font-size:22px;color:#fff;border:3px solid var(--line)}
.ytav .fl{position:absolute;top:44px;inset-inline-start:2px;width:24px;height:24px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;border:2px solid var(--bg)}.ytav .fl svg{width:14px;height:14px}.ytav.on .av{border-color:var(--pri)}
.ytcard{display:block;width:100%;text-align:start;margin-bottom:16px}.ytcard .th{position:relative;border-radius:18px;overflow:hidden;background:var(--card2);aspect-ratio:16/9}.ytcard .th img{width:100%;height:100%;object-fit:cover;display:block}
.ytcard .th .pl{position:absolute;inset:0;display:grid;place-items:center}.ytcard .th .pl span{width:54px;height:54px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center}
.ytcard .tt{font-weight:700;margin-top:8px;line-height:1.5}
.sessbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:rgba(255,107,122,.14);color:var(--bad);font-weight:700;font-size:13.5px;margin-bottom:10px}.sessbar.on{background:rgba(61,214,160,.14);color:var(--ok)}.sessbar .grow{min-width:0}
.fpill{position:fixed;left:50%;transform:translateX(-50%);z-index:45;background:var(--pri);color:#fff;border-radius:99px;padding:9px 18px;display:flex;gap:8px;align-items:center;font-weight:800;box-shadow:0 6px 22px rgba(0,0,0,.4);font-size:15px}.fpill[hidden]{display:none}
.mem{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);width:100%;text-align:start}.mem:last-child{border:0}
.mav{width:44px;height:44px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
.live{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block;margin-inline-end:5px}.live.off{background:#6b7280}.live.on{box-shadow:0 0 0 4px rgba(61,214,160,.25)}
.codebox{font-size:30px;font-weight:900;letter-spacing:6px;text-align:center;direction:ltr;padding:10px;background:var(--card2);border-radius:14px;margin:8px 0}
.hscene{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(#131a45 0%,#262d68 58%,#4a3a31 58%,#5b4638 100%);padding:12px 10px 10px}
.hscene:before{content:"";position:absolute;inset:0 0 42% 0;background-image:radial-gradient(1.4px 1.4px at 12% 22%,#fff,transparent),radial-gradient(1.2px 1.2px at 34% 12%,#fff,transparent),radial-gradient(1.6px 1.6px at 58% 28%,#ffe9a8,transparent),radial-gradient(1.2px 1.2px at 78% 14%,#fff,transparent),radial-gradient(1.4px 1.4px at 90% 32%,#cfe3ff,transparent),radial-gradient(1px 1px at 22% 40%,#fff,transparent);opacity:.9;pointer-events:none}
.hgrid{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hs{aspect-ratio:1;border-radius:14px;background:rgba(255,255,255,.07);border:1px dashed rgba(255,255,255,.25);display:grid;place-items:center;color:rgba(255,255,255,.55);position:relative}
.hs.on{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.12)}.hs svg{width:78%;height:78%}.hs .plus svg{width:22px;height:22px}

const bubble = (role, content) => role === 'user' ? `<div class="msg u">${esc(content).replace(/\n/g, '<br>')}</div>` : `<div class="msg a">${renderMD(content)}</div>`;
function mountChat() {
  const box = $('#msgs');
  box.innerHTML = S.history.length ? S.history.map(m => bubble(m.role, m.content)).join('') : `<div class="msg a">${renderMD('أهلاً بيك! أنا **الأستاذ**.\nاسألني عن أي درس، أو **أرفق صورة المسألة** مع وصف إن حبيت وأحلّها لك خطوة بخطوة، والمعادلات تظهر مرتّبة.')}</div>`;
  box.scrollTop = box.scrollHeight;
  const inp = $('#inp'); inp.addEventListener('input', () => { inp.style.height = 'auto'; inp.style.height = Math.min(130, inp.scrollHeight) + 'px'; });
  inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendChat(); } });
  updatePend(); if (S.params.prefill) { inp.value = S.params.prefill; S.params.prefill = ''; inp.focus(); }
}
function updatePend() {
  const p = $('#pend'), inp = $('#inp'); if (!p) return; p.hidden = !S.pend;
  p.innerHTML = S.pend ? `<img src="${S.pend}" alt=""><div class="grow small muted">اكتب وصفاً للصورة في الخانة بالأسفل (اختياري) ثم أرسل</div><button class="ibtn" data-act="rmPend" aria-label="إزالة الصورة">${IC.close}</button>` : '';
  if (inp) inp.placeholder = S.pend ? 'وصف للصورة (اختياري): مثلاً حل السؤال الثاني' : 'اكتب سؤالك أو أرفق صورة المسألة';
}
function addBubble(html) { const box = $('#msgs'); if (!box) return null; box.insertAdjacentHTML('beforeend', html); box.scrollTop = box.scrollHeight; return box.lastElementChild; }
let chatBusy = false;
const QUICK = [['بسّط أكثر', 'بسّط الشرح أكثر وبكلام سهل وأقصر'], ['اختصر', 'اختصر الجواب بنقاط قصيرة'], ['مثال', 'أعطني مثالاً محلولاً بسيطاً']];
const quickBar = () => `<div class="qk">${QUICK.map(([n, q]) => `<button class="chip" data-act="quick" data-q="${esc(q)}">${n}</button>`).join('')}</div>`;
const TYPING = '<div class="msg a"><div class="typing"><i></i><i></i><i></i></div></div>';
async function sendChat() {
  const inp = $('#inp'); const text = (inp.value || '').trim(); const img = S.pend;
  if ((!text && !img) || chatBusy) return;
  inp.value = ''; inp.style.height = 'auto'; chatBusy = true; S.pend = null; updatePend();
  if (img) { S.history.push({ role: 'user', content: 'صورة مرفقة' + (text ? ': ' + text : '') }); addBubble(`<div class="msg u"><img src="${img}" alt="" style="max-width:100%;border-radius:12px;display:block;margin-bottom:6px">${text ? esc(text) : ''}</div>`); }
  else { S.history.push({ role: 'user', content: text }); addBubble(bubble('user', text)); }
  const typing = addBubble(TYPING);
  try {
    const d = img ? await api('/api/ocr', { image: img, question: text, subject: S.chatSubject }) : await api('/api/chat', { message: text, subject: S.chatSubject });
    S.history.push({ role: 'assistant', content: d.answer }); S.stats.used_today = (S.stats.used_today || 0) + 1;
    if (typing) typing.remove();
    document.querySelectorAll('.qk').forEach(e => e.remove());
    addBubble(`<div class="msg a">${renderMD(d.answer)}${d.sources && d.sources.length ? `<div class="src">${IC.book} ${d.sources.map(esc).join(' • ')}</div>` : ''}${quickBar()}</div>`); hapN('success');
  } catch (e) { if (typing) typing.remove(); addBubble(`<div class="msg a err">${esc(e.message)}</div>`); hapN('error'); }
  chatBusy = false;
}
function fileToJpeg(file, max = 1600) {
  return new Promise((res, rej) => { const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)), w = Math.round(img.width * k), h = Math.round(img.height * k); const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.82)); };
    img.onerror = () => rej(new Error('تعذّر فتح الصورة')); img.src = url; });
}

/* الاختبارات */
function runQuiz(data, meta) {
  if (!data.questions || !data.questions.length) return toast('ما كدرت أجهّز أسئلة، جرّب مرة ثانية.');
  S.Q = { qs: data.questions, i: 0, score: 0, wrong: [], fixed: [], meta: Object.assign({ subject: '', chapter_id: data.chapter_id || 0, kind: 'normal', title: data.title || '' }, meta), picked: null, done: false, saved: false };
  go('quiz');
}
const vQuiz = () => '<div id="qbox"></div>';
function drawQuiz() {
  const Q = S.Q, box = $('#qbox'); if (!Q || !box) return;
  if (Q.done) {
    const pct = Math.round(100 * Q.score / Q.qs.length), msg = pct >= 80 ? 'ممتاز! عاشت إيدك' : pct >= 50 ? 'زين، بس تحتاج مراجعة بسيطة' : 'لا تيأس، راجع الأخطاء وارجع أقوى';
    box.innerHTML = `<div class="qh"><button class="back" data-act="back" aria-label="خروج">${IC.close}</button><div class="h3 grow">النتيجة</div></div><div class="ring" style="--p:${pct}"><b>${Q.score}/${Q.qs.length}</b></div>
      <div class="h3 center">${msg}</div>${Q.wrong.length ? `<div class="h2">أخطاؤك</div>` + Q.wrong.map(w => `<div class="card"><div class="qtext" style="font-size:16px;margin:0 0 8px">${renderInline(w.q)}</div><div class="small row" style="color:var(--ok)">${IC.check}<span>${renderInline(w.options[w.answer])}</span></div>${w.explain ? `<div class="muted small" style="margin-top:6px">${renderInline(w.explain)}</div>` : ''}</div>`).join('') + `<div class="muted small center">حفظتها في «مراجعة اللي فات» لتراجعها لاحقاً</div>` : ''}
      <button class="btn block" style="margin-top:14px" data-act="back">تمام</button>`; return;
  }
  const q = Q.qs[Q.i], letters = ['أ', 'ب', 'ج', 'د', 'هـ'], tag = [q.tag ? `<span class="badge gold">${IC.hall} ${esc(q.tag)}</span>` : '', Q.meta.kind === 'review' ? '<span class="badge">مراجعة</span>' : ''].join(' ');
  const ok = Q.picked === q.answer;
  box.innerHTML = `<div class="qh"><button class="back" data-act="back" aria-label="خروج">${IC.close}</button><div class="grow"><div class="bar"><i style="width:${Math.round(100 * Q.i / Q.qs.length)}%"></i></div></div><span class="muted small">${Q.i + 1}/${Q.qs.length}</span></div>
    ${tag}<div class="qtext">${renderInline(q.q)}</div>
    ${q.options.map((o, i) => { const st = Q.picked == null ? '' : i === q.answer ? 'right' : i === Q.picked ? 'wrong' : ''; return `<button class="opt ${st}" data-act="pick" data-i="${i}" ${Q.picked != null ? 'disabled' : ''}><span class="k">${letters[i]}</span><span>${renderInline(o)}</span></button>`; }).join('')}
    ${Q.picked != null ? `<div class="expl"><b class="row" style="color:${ok ? 'var(--ok)' : 'var(--bad)'}">${ok ? IC.check : IC.x}<span>${ok ? 'صح' : 'غلط'}</span></b>${q.explain ? '<div style="margin-top:4px">' + renderInline(q.explain) + '</div>' : ''}${q.src ? `<div class="src">${IC.book} ${esc(q.src)}</div>` : ''}</div><button class="btn block" data-act="nextQ">${Q.i + 1 === Q.qs.length ? 'إنهاء' : 'التالي'}</button>` : ''}`;
}
async function finishQuiz() {
  const Q = S.Q; Q.done = true; drawQuiz(); hapN(Q.score / Q.qs.length >= .5 ? 'success' : 'warning'); if (Q.saved) return; Q.saved = true;
  try {
    if (Q.meta.kind === 'challenge') { await api('/api/challenge_result', { score: Q.score, total: Q.qs.length, subject: Q.meta.subject }); S.challenge = null; S.board = null; }
    else { const qr = await api('/api/quiz_result', { subject: Q.meta.subject, chapter_id: Q.meta.chapter_id, score: Q.score, total: Q.qs.length, kind: Q.meta.kind, wrong: Q.wrong.filter(w => !w.mid).map(({ q, options, answer, explain }) => ({ q, options, answer, explain })), fixed: Q.fixed }); if (qr.game) S.game = qr.game; if (qr.stars_gain) toast('+' + qr.stars_gain + ' كوينز من هذا الاختبار'); }
    const s = await api('/api/init'); S.stats = s.stats; S.perf = s.perf; S.resume = s.resume;
  } catch (e) { toast('ما قدرت أحفظ نتيجتك: ' + e.message); }
}

function upUi(pct, msg, err) { const b = $('#upbar'), m = $('#upmsg'), s = $('#upst'); if (!s) return; s.hidden = false; if (b) b.style.width = pct + '%'; if (m) { m.textContent = clean(msg); m.style.color = err ? 'var(--bad)' : ''; } }
function doUpload() {
  const f = S.file; if (!f) return toast('اختر الملف أولاً');
  if (S.upBusy) return; const kind = fv('up_kind', 'book');
  const meta = { filename: f.name, kind, subject: fv('up_subj', firstSubj()), title: (fv('up_title') || '').trim() || f.name.replace(/\.[^.]+$/, ''), year: fv('up_year') || null, round: fv('up_round') || null, append_to: fv('up_append') || null, start_page: fv('up_start') || null };
  S.upBusy = true; upUi(0, 'جاري رفع الملف…');
  const x = new XMLHttpRequest(); x.open('POST', '/api/admin/upload');
  Object.entries(hdrs()).forEach(([k, v]) => x.setRequestHeader(k, v)); x.setRequestHeader('X-Meta', encodeURIComponent(JSON.stringify(meta))); x.setRequestHeader('Content-Type', 'application/octet-stream');
  x.upload.onprogress = e => { if (e.lengthComputable) upUi(Math.round(100 * e.loaded / e.total), 'رفع الملف ' + Math.round(100 * e.loaded / e.total) + '٪'); };
  x.onerror = () => { S.upBusy = false; upUi(0, 'انقطع الاتصال أثناء الرفع، أعد المحاولة', true); };
  x.onload = () => {
    let d = {}; try { d = JSON.parse(x.responseText); } catch (e) {}
    if (x.status !== 200 || !d.job) { S.upBusy = false; return upUi(0, d.error || 'تعذّر الرفع', true); }
    upUi(5, 'جاري قراءة الملف وفهرسته…'); pollJob(d.job);
  };
  x.send(f);
}
async function pollJob(id) {
  for (;;) {
    await sleep(2000); let j;
    try { j = await api('/api/admin/job?id=' + id); } catch (e) { S.upBusy = false; return upUi(0, e.message, true); }
    upUi(Math.max(5, j.pct), j.msg);
    if (j.status === 'done') {
      S.upBusy = false; S.file = null; S.f.up_title = ''; hapN('success');
      const r = j.result || {}; toast(`تمت الإضافة: ${r.pages} صفحة، ${r.chunks} مقطع` + ((r.notes || []).length ? ' - ' + r.notes.join(' - ') : ''));
      return refreshAdmin();
    }
    if (j.status === 'error') { S.upBusy = false; hapN('error'); return upUi(0, j.msg, true); }
  }
}

function houseScene(h, edit) {
  let slots = '';
  for (let i = 0; i < h.slots; i++) {
    const k = h.placed[i], lamp = k && k.startsWith('lamp_');
    if (k) slots += edit ? `<button class="hs on ${lamp ? 'glow' : ''}" data-act="hslot" data-s="${i}" aria-label="قطعة">${hiArt(k)}</button>` : `<div class="hs on ${lamp ? 'glow' : ''}">${hiArt(k)}</div>`;
    else slots += edit ? `<button class="hs" data-act="hslot" data-s="${i}" aria-label="مكان فارغ"><span class="plus">${IC.plus}</span></button>` : `<div class="hs"></div>`;
  }
  const chars = h.chars.map((c, i) => `${edit ? `<button class="hch" data-act="hchar" data-i="${i}">` : '<div class="hch">'}${hiArt(c.k, 52)}<div>${esc(c.name)}</div>${edit ? '</button>' : '</div>'}`).join('');
  return `<div class="hscene"><div class="hgrid">${slots}</div><div class="hchars">${chars}</div></div>`;
}

  tsell: async d => { closeSheet(); if (!(await ask('تبيع القطعة بنصف سعرها؟'))) return; if (await tdo({ action: 'sell', x: +d.x, y: +d.y })) { toast('انباعت'); tredraw(); } },
  lb: () => go('lb'), lbk: d => { S.lbk = d.k; $('#view').innerHTML = vLb(); mountLb(); }
});
/* المتصدّرون */
const LBK = [['study_day', 'دراسة اليوم'], ['study_week', 'دراسة الأسبوع'], ['points', 'النقاط'], ['coins', 'الكوينز']];
function vLb() {
  const k = S.lbk || 'study_day', d = (S.lbd || {})[k], head = `<div class="sub-head"><button class="back" data-act="back" aria-label="رجوع">${IC.chev}</button><div class="h1">المتصدّرون</div></div>`;
  const chips = `<div class="row" style="flex-wrap:wrap;gap:6px;margin:10px 0">${LBK.map(([a, n]) => `<button class="chip ${a === k ? 'on' : ''}" style="padding:0 11px;font-size:13px" data-act="lbk" data-k="${a}">${n}</button>`).join('')}</div>`;
  if (!d) return head + chips + '<div class="empty"><div class="spin" style="margin:0 auto 10px"></div>جاري التحميل…</div>';
  const fv_ = v => k.startsWith('study') ? fmtMin(v) : k === 'points' ? v + ' نقطة' : v + ' كوينز', medal = r => r;
  const row = x => `<div class="li lbr ${x.me ? 'me' : ''}"><span class="lbn r${x.rank}">${medal(x.rank)}</span><span class="grow">${esc(x.name)}${x.me && x.name !== 'أنت' ? ' (أنت)' : ''}</span><b>${fv_(x.v)}</b></div>`;
  const body = d.rows.length ? d.rows.map(row).join('') : '<div class="empty">ما كو أحد بعد. كون أول واحد!</div>';
  const mine = d.mine && !d.rows.some(x => x.me) ? `<div class="muted small center" style="margin:10px 0 4px">ترتيبك</div>${row(d.mine)}` : '';
  return head + chips + `<div class="card">${body}</div>${mine}`;
}
async function mountLb() { const k = S.lbk || 'study_day'; S.lbd = S.lbd || {}; try { S.lbd[k] = await api('/api/lb', { kind: k }); } catch (e) { toast(e.message); return; } if (S.view === 'lb' && (S.lbk || 'study_day') === k) $('#view').innerHTML = vLb(); }


/* ═══ عالم المزرعة الكبير ═══ */
Object.assign(ACT, { town: () => go('world') });
async function mountWorld() {
  if (!window.WorldGame) { try { await new Promise((ok, no) => { const s = document.createElement('script'); s.src = '/static/world.js?v=3'; s.onload = ok; s.onerror = no; document.head.appendChild(s); }); } catch (e) { toast('تعذّر تحميل اللعبة'); back(); return; } }
  if (S.view === 'world' && !WorldGame.isOpen()) WorldGame.open({ api, ask, toast, back: () => ACT.back(), bkAdd, bkDel });
}
</script>
